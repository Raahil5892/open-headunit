name: Release Virtual Cockpit APK

on:
  push:
    branches:
      - feat/dual-cluster-cockpit
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-and-release:
    name: Assemble Dual-Cluster Cockpit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Install Android SDK Platform 36, NDK 29 & CMake 3.22.1
        run: |
          for attempt in 1 2 3; do
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK (assembleGithubDebug)
        run: ./gradlew assembleGithubDebug --no-daemon --stacktrace

      - name: Copy APK with descriptive cluster names
        run: |
          SRC_APK=$(ls app/build/outputs/apk/github/debug/*.apk | head -n 1)
          cp "$SRC_APK" app/build/outputs/apk/github/debug/open-headunit-virtual-cockpit-v4.0.0-cluster2-debug.apk
          cp "$SRC_APK" app/build/outputs/apk/github/debug/open-headunit-virtual-cockpit-v4.0.0-cluster3-debug.apk
          ls -lh app/build/outputs/apk/github/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-headunit-virtual-cockpit-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release v4.0.0-cluster2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0-cluster2
          target_commitish: ${{ github.sha }}
          name: "Open Headunit Virtual Cockpit v4.0.0-cluster2 (Fixed Multi-Display Input Pairing & Android 17 Cluster Topology)"
          body: |
            ### Open Headunit Virtual Cockpit (`v4.0.0-cluster2` / `v4.0.0-cluster3`)
            - **Fixed Multi-Display `ServiceDiscoveryResponse` Topology for Android Auto 17 (`ServiceDiscoveryResponse.kt`, `Channel.kt`, `AapControl.kt`, `VideoFocusEvent.kt`)**:
              - Added paired `Channel.ID_CLU_INP` (`15`) `InputSourceService` with `display_id = 1` (field 5) alongside `Channel.ID_CLU` (`14`) `MediaSinkService` (`display_id = 1`), and stamped explicit `display_id = 0` / `display_type = DISPLAY_TYPE_MAIN (0)` on primary `Channel.ID_VID` (`2`) and `Channel.ID_INP` (`3`) when `enableClusterDisplay` is active. Android Auto 17's multi-display topology validator (`jnb.java:223-308`) strictly requires a 1:1 `InputSourceService` per advertised `CarDisplayId`, even when the cluster screen has no touch input.
              - Added `Cluster Display Role` (`Aux Map (Full Nav)` vs `Cluster (OEM)`) in **Settings → Graphic** (`DISPLAY_TYPE_AUXILIARY = 2` + `KEYCODE_NAVIGATION = 65538` vs `DISPLAY_TYPE_CLUSTER = 1`).
              - Updated `Channel.ID_CLU` setup response to use `maxUnacked = 10` and `VIDEO_FOCUS_PROJECTED_NO_INPUT_FOCUS` (`unsolicited = false`).
          files: |
            app/build/outputs/apk/github/debug/*.apk
          draft: false
          prerelease: false

      - name: Publish GitHub Release v4.0.0-cluster3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0-cluster3
          target_commitish: ${{ github.sha }}
          name: "Open Headunit Virtual Cockpit v4.0.0-cluster3 (Fixed Multi-Display Input Pairing & Android 17 Cluster Topology)"
          body: |
            ### Open Headunit Virtual Cockpit (`v4.0.0-cluster3`)
            - **Fixed Multi-Display `ServiceDiscoveryResponse` Topology for Android Auto 17 (`ServiceDiscoveryResponse.kt`, `Channel.kt`, `AapControl.kt`, `VideoFocusEvent.kt`)**:
              - Added paired `Channel.ID_CLU_INP` (`15`) `InputSourceService` with `display_id = 1` (field 5) alongside `Channel.ID_CLU` (`14`) `MediaSinkService` (`display_id = 1`), and stamped explicit `display_id = 0` / `display_type = DISPLAY_TYPE_MAIN (0)` on primary `Channel.ID_VID` (`2`) and `Channel.ID_INP` (`3`) when `enableClusterDisplay` is active. Android Auto 17's multi-display topology validator (`jnb.java:223-308`) strictly requires a 1:1 `InputSourceService` per advertised `CarDisplayId`, even when the cluster screen has no touch input.
              - Added `Cluster Display Role` (`Aux Map (Full Nav)` vs `Cluster (OEM)`) in **Settings → Graphic** (`DISPLAY_TYPE_AUXILIARY = 2` + `KEYCODE_NAVIGATION = 65538` vs `DISPLAY_TYPE_CLUSTER = 1`).
              - Updated `Channel.ID_CLU` setup response to use `maxUnacked = 10` and `VIDEO_FOCUS_PROJECTED_NO_INPUT_FOCUS` (`unsolicited = false`).
          files: |
            app/build/outputs/apk/github/debug/*.apk
          draft: false
          prerelease: false
